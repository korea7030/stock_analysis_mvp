name: Monitor Production

"on":
  workflow_dispatch:
    inputs:
      site_url:
        description: "Production frontend URL"
        required: false
        default: "https://finnblog.pe.kr"
      tool_url:
        description: "Production analysis tool URL"
        required: false
        default: "https://app.finnblog.pe.kr"
      api_base_url:
        description: "Production backend API base URL"
        required: false
        default: "https://stock-backend-api-344913823090.us-central1.run.app"
  schedule:
    - cron: "*/30 * * * *"

env:
  SITE_URL: ${{ github.event.inputs.site_url || vars.PRODUCTION_SITE_URL || 'https://finnblog.pe.kr' }}
  TOOL_URL: ${{ github.event.inputs.tool_url || vars.PRODUCTION_TOOL_URL || 'https://app.finnblog.pe.kr' }}
  API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.PRODUCTION_API_BASE_URL || 'https://stock-backend-api-344913823090.us-central1.run.app' }}
  SMOKE_TICKER: ${{ vars.MONITOR_SMOKE_TICKER || 'AAPL' }}
  SMOKE_FORM: ${{ vars.MONITOR_SMOKE_FORM || '10-Q' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run production smoke checks
        id: smoke
        shell: bash
        run: |
          set +e

          SUMMARY_FILE="monitor-summary.md"
          : > "$SUMMARY_FILE"

          fail_count=0
          site_origin="${SITE_URL%/}"
          tool_origin="${TOOL_URL%/}"
          api_origin="${API_BASE_URL%/}"

          add_line() {
            printf '%s\n' "$1" | tee -a "$SUMMARY_FILE"
          }

          check_url() {
            local name="$1"
            local url="$2"
            local timeout_s="$3"
            local expected="${4:-}"
            local expected_status="${5:-2xx}"
            local forbidden="${6:-}"

            local body_file
            body_file="$(mktemp)"
            local start_ms
            start_ms="$(date +%s%3N)"

            local http_code
            http_code="$(curl \
              --silent \
              --show-error \
              --location \
              --max-time "$timeout_s" \
              --connect-timeout 10 \
              --output "$body_file" \
              --write-out '%{http_code}' \
              "$url" 2>> "$SUMMARY_FILE")"
            local curl_status=$?

            local end_ms
            end_ms="$(date +%s%3N)"
            local elapsed_ms=$((end_ms - start_ms))

            if [ "$curl_status" -ne 0 ]; then
              add_line "- ❌ ${name}: curl failed status=${curl_status} elapsed=${elapsed_ms}ms url=${url}"
              fail_count=$((fail_count + 1))
              rm -f "$body_file"
              return
            fi

            if { [ "$expected_status" = "2xx" ] && { [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; }; } || \
              { [ "$expected_status" != "2xx" ] && [ "$http_code" != "$expected_status" ]; }; then
              add_line "- ❌ ${name}: HTTP ${http_code} elapsed=${elapsed_ms}ms url=${url}"
              add_line "  body: $(head -c 300 "$body_file" | tr '\n' ' ')"
              fail_count=$((fail_count + 1))
              rm -f "$body_file"
              return
            fi

            if [ -n "$expected" ] && ! grep -Fq "$expected" "$body_file"; then
              add_line "- ❌ ${name}: expected text not found (${expected}) elapsed=${elapsed_ms}ms url=${url}"
              add_line "  body: $(head -c 300 "$body_file" | tr '\n' ' ')"
              fail_count=$((fail_count + 1))
              rm -f "$body_file"
              return
            fi

            if [ -n "$forbidden" ] && grep -Fq "$forbidden" "$body_file"; then
              add_line "- ❌ ${name}: forbidden text found (${forbidden}) elapsed=${elapsed_ms}ms url=${url}"
              fail_count=$((fail_count + 1))
              rm -f "$body_file"
              return
            fi

            add_line "- ✅ ${name}: HTTP ${http_code} elapsed=${elapsed_ms}ms"
            rm -f "$body_file"
          }

          add_line "# Production monitor"
          add_line ""
          add_line "- Site: ${site_origin}"
          add_line "- Tool: ${tool_origin}"
          add_line "- API: ${api_origin}"
          add_line "- Smoke ticker/form: ${SMOKE_TICKER}/${SMOKE_FORM}"
          add_line "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          add_line ""
          add_line "## Checks"

          check_url "frontend home canonical" "${site_origin}/" 20 "rel=\"canonical\" href=\"${site_origin}\""
          check_url "frontend robots" "${site_origin}/robots.txt" 20 "Sitemap: ${site_origin}/sitemap.xml"
          check_url "frontend sitemap" "${site_origin}/sitemap.xml" 20 "<urlset"
          check_url "editorial AdSense" "${site_origin}/guides/10q-10k-8k-difference" 20 "pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"
          check_url "frontend 404" "${site_origin}/__monitor_missing__" 20 'name="robots" content="noindex"' 404 "pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"
          check_url "tool home" "${tool_origin}/" 20 'name="robots" content="noindex, follow"' 2xx "pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"
          check_url "tool 404" "${tool_origin}/__monitor_missing__" 20 'name="robots" content="noindex"' 404 "pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"
          check_url "legacy tool route" "${site_origin}/?ticker=${SMOKE_TICKER}&form=${SMOKE_FORM}" 20 "${tool_origin}/" 2xx
          check_url "backend health" "${api_origin}/health" 15 '"status":"ok"'
          check_url "backend calendar" "${api_origin}/calendar?weeks=1&kind=all" 45
          check_url "backend analyze smoke" "${api_origin}/analyze?ticker=${SMOKE_TICKER}&form=${SMOKE_FORM}" 120 '"ticker"'

          add_line ""
          if [ "$fail_count" -gt 0 ]; then
            add_line "Result: ${fail_count} production smoke check(s) failed."
            exit 1
          fi

          add_line "Result: all production smoke checks passed."

      - name: Upload monitor summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-monitor-summary
          path: monitor-summary.md
          if-no-files-found: error

      - name: Create or update production alert issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "[prod-alert] Production smoke checks failed";
            const label = "production-monitor";
            const body = fs.readFileSync("monitor-summary.md", "utf8");
            const { owner, repo } = context.repo;

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: "B60205",
                description: "Production smoke check failures",
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
              per_page: 20,
            });

            const issue = existing.data.find((item) => item.title === title && !item.pull_request);
            if (issue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: [label],
            });
